<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="Arial, sans-serif">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker></defs>
<text x="20" y="30" font-size="16" text-anchor="start" fill="#222" font-weight="bold">Fragmentación interna y externa</text>
<text x="60" y="60" font-size="13" text-anchor="start" fill="#222" font-weight="bold">Interna: el bloque asignado es más grande que lo que el proceso pide</text>
<rect x="60" y="75" width="320" height="40" rx="4" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
<rect x="60" y="75" width="200" height="40" rx="4" fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="160" y="100" font-size="12" text-anchor="middle" fill="#222" font-weight="normal">Proceso (200)</text>
<text x="300" y="100" font-size="12" text-anchor="middle" fill="#b91c1c" font-weight="normal">sobra (120)</text>
<text x="430" y="100" font-size="12" text-anchor="start" fill="#222" font-weight="normal">bloque asignado = 320</text>
<text x="60" y="160" font-size="13" text-anchor="start" fill="#222" font-weight="bold">Externa: hay huecos libres, pero ninguno alcanza para el proceso</text>
<rect x="60" y="175" width="70" height="40" rx="4" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
<rect x="150" y="175" width="90" height="40" rx="4" fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>
<rect x="260" y="175" width="60" height="40" rx="4" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
<rect x="340" y="175" width="100" height="40" rx="4" fill="#93c5fd" stroke="#374151" stroke-width="1.5"/>
<rect x="460" y="175" width="50" height="40" rx="4" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
<text x="60" y="240" font-size="13" text-anchor="start" fill="#333" font-weight="normal">Huecos libres de 70, 60 y 50: suman 180, pero un proceso de 120 no entra.</text>
</svg>
